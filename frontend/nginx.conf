server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Content-Security-Policy (production): SPA assets are same-origin only.
    # Inline styles are allowed for React style attributes; scripts are strict
    # same-origin (no inline/eval). frame-ancestors 'none' blocks clickjacking.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # All /api/* go to the sidecar (which proxies chat/pse/tools to agent-httpd
    # with SSE dialect translation, and serves sessions/jobs/tasks/... itself).
    location /api/ {
        proxy_pass http://sidecar:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SSE: must disable buffering or the stream is batched.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # Direct React/Vite/agent-httpd relay (kept for any /react routes the SPA uses).
    location /react/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1800s;
    }
}
