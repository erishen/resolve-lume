# ⚠️ 当前【未被使用】的参考配置，不要按它排障。
# frontend/Dockerfile 的 runtime stage 跑的是 node server-entrypoint.mjs，
# 既没有安装 nginx，也没有 COPY 本文件、没有 envsubst。
# 真正生效的安全头 / SSE 超时 / token 注入都在 frontend/server-entrypoint.mjs；
# index.html 里的 meta CSP 也会随 dist 一起下发。此文件仅在将来切回 nginx 时参考。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Content-Security-Policy (production): SPA assets are same-origin only.
    # Inline styles are allowed for React style attributes; scripts are strict
    # same-origin (no inline/eval). frame-ancestors 'none' blocks clickjacking.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # All /api/* go to the host sidecar process on macOS (127.0.0.1:3000), reached via
    # host.docker.internal (the host-gateway alias on Docker Desktop / OrbStack).
    # The sidecar proxies chat/pse/tools to agent-httpd and serves sessions/jobs/tasks/...
    location /api/ {
        proxy_pass http://host.docker.internal:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Shared secret (rendered by envsubst at container start, see Dockerfile).
        # The host sidecar validates the same SIDECAR_TOKEN read from .env, so /api
        # cannot be driven without it.
        proxy_set_header X-Sidecar-Token ${SIDECAR_TOKEN};
        # SSE: must disable buffering or the stream is batched.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # Direct React/Vite/agent-httpd relay (kept for any /react routes the SPA uses).
    location /react/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1800s;
    }

    # 宿主 launcher 又回来了：sidecar 现跑在宿主机上（make sidecar-host-start 经
    # sidecar/launcher.js 常驻，监听 127.0.0.1:3000），/launcher 路由目前未接反代。
    # 工具层状态仍由 /api/tool-layer 提供，启停请用 `make sidecar-host-start` /
    # `make sidecar-host-stop`，compose 只管 backend + frontend 两个容器。
}